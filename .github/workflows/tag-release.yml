name: Tag Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: mmap-dump
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release
    permissions:
      contents: read
      security-events: write # Upload zizmor SARIF results
    uses: ./.github/workflows/ci.yml

  build:
    name: Build native binary
    needs: [validate]
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build native binary
        run: nix build ".#${PACKAGE_NAME}-native"

      - name: Create release archive
        run: |
          mkdir dist
          tar -C result/bin -czf "dist/${PACKAGE_NAME}-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" "$PACKAGE_NAME"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  publish-github:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04

    permissions:
      contents: write # Create and upload the release

    steps:
      - name: Download release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$RELEASE_TAG"
          --generate-notes
          --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
