[package]
name = "mmap-dump"
version = "0.3.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.6", features = ["derive"] }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
memmap2 = "0.9.11"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"


[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
