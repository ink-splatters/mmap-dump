[package]
name = "mmap-dump"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"  # Handled explicitly

[profile.release]
codegen-units = 1
lto = "thin"